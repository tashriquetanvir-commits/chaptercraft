<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChapterCraft</title>
<style>
:root{font:16px system-ui;color:#172037;background:#edf0f8}
*{box-sizing:border-box} body{margin:0} main{max-width:960px;margin:auto;padding:48px 24px}
h1{font-size:clamp(2.5rem,8vw,4rem);letter-spacing:-.06em;margin:0;color:#25265c}
p{color:#4c5670;line-height:1.5} .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
section{background:white;border-radius:18px;padding:22px;box-shadow:0 5px 24px #24256012}
h2{font-size:1.15rem;margin-top:0} textarea,input{font:inherit;color:inherit}
textarea{width:100%;min-height:240px;resize:vertical;padding:12px;border:1px solid #adb4cb;border-radius:8px}
input[type=file]{display:block;max-width:100%;margin:8px 0 14px}
button{background:#4b43a6;color:white;border:0;padding:10px 14px;border-radius:8px;font:inherit;cursor:pointer}
button.secondary{background:#eae8fb;color:#353178} button:disabled{opacity:.55;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px} label{font-weight:600}
#status{min-height:1.5em} @media(max-width:680px){.grid{grid-template-columns:1fr}}
</style>
<main>
<h1>ChapterCraft</h1>
<p>Turn timestamped captions into editable video chapters.</p>
<div class="grid">
<section>
<h2>Transcript</h2>
<label for="file">Upload an SRT or VTT file</label>
<input type="file" id="file" accept=".srt,.vtt,text/plain">
<label for="transcript">Or paste timestamped text</label>
<textarea id="transcript" placeholder="0:00 Welcome to the video&#10;1:42 Setting up the project"></textarea>
<div class="actions"><button id="generate">Generate chapters</button><button class="secondary" id="sample">Try sample</button></div>
</section>
<section>
<h2><label for="output">Suggested chapters</label></h2>
<textarea id="output" placeholder="Edit titles and timestamps here after generating."></textarea>
<div class="actions"><button id="copy" class="secondary">Copy chapters</button></div>
</section>
</div>
<p id="status" role="status" aria-live="polite"></p>
</main>
<script>
const byId = id => document.getElementById(id);
const transcript = byId('transcript');
const output = byId('output');
const status = byId('status');
const generate = byId('generate');

byId('file').addEventListener('change', async event => {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 1000000) {
        status.textContent = 'Choose a caption file smaller than 1 MB.';
        return;
    }
    try {
        transcript.value = await file.text();
        status.textContent = 'Captions loaded.';
    } catch {
        status.textContent = 'Could not read the file.';
    }
});

byId('sample').onclick = () => {
    transcript.value = [
        '0:00 Welcome to this video about setting up a home garden.',
        '0:20 We will cover small garden projects for beginners.',
        '0:31 Soil and compost give seedlings nutrients and support healthy roots.',
        '0:48 Add compost to the soil and fill containers before planting seedlings.',
        '1:04 Water seedlings gently. Check the soil before watering each morning.',
        '1:21 Containers need drainage holes to prevent water pooling around roots.',
        '1:40 Harvest herbs with scissors when leaves are ready.',
        '1:55 Store harvested herbs in the refrigerator or dry them for cooking.'
    ].join('\n');
    status.textContent = 'Sample loaded. Click Generate chapters.';
};

function timestamp(seconds) {
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor(seconds / 60) % 60;
    const remainder = String(seconds % 60).padStart(2, '0');
    return hours ? hours + ':' + String(minutes).padStart(2, '0') + ':' + remainder
                 : minutes + ':' + remainder;
}

generate.onclick = async () => {
    generate.disabled = true;
    status.textContent = 'Generating chapters…';
    try {
        const response = await fetch('/generate', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({transcript: transcript.value})
        });
        if (response.status === 413) throw new Error('The transcript is too large.');
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Could not generate chapters.');
        output.value = data.chapters.map(chapter =>
            timestamp(chapter.start) + ' ' + chapter.title
        ).join('\n');
        status.textContent = data.chapters.length + ' suggested chapters. Edit the titles before copying.';
    } catch (error) {
        status.textContent = error.message;
    } finally {
        generate.disabled = false;
    }
};

byId('copy').onclick = async () => {
    if (!output.value.trim()) {
        status.textContent = 'Generate chapters first.';
        return;
    }
    try {
        await navigator.clipboard.writeText(output.value);
        status.textContent = 'Chapters copied.';
    } catch {
        output.select();
        status.textContent = 'Press Ctrl+C to copy the selected chapters.';
    }
};
</script>
</html>
